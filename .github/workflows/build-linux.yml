name: Build Учитель ИИ (Linux)

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build:
    name: Linux x64 AppImage and deb
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libnss3 libatk1.0-0 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Install Node dependencies
        run: npm ci

      - name: Run project checks
        run: npm test

      - name: Build Linux packages
        run: npm run dist:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload AppImage and deb
        uses: actions/upload-artifact@v4
        with:
          name: UchitelII-Linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14
